<svg width="100%" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080C10"/>
      <stop offset="60%" stop-color="#05070A"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0E1720" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0E1720" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1A2830" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1400" height="620" rx="14"/></clipPath>

    <style>
      /* Decorative-only content: safe to hide on narrow renders. */
      @media (max-width: 640px) {
        .frame-meta, .telemetry, .orbit-decor { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="620" fill="url(#bg)"/>
    <rect width="1400" height="620" fill="url(#grid)"/>
    <rect width="1400" height="620" fill="url(#vignette)"/>

    <!-- decorative frame meta — never required to read the design -->
    <g class="frame-meta" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#7C8B92" letter-spacing="1.5">
      <text x="48" y="40">BINARYLOOPS // PROFILE.SVG</text>
      <text x="1352" y="40" text-anchor="end">REV 03</text>
    </g>
    <line x1="48" y1="54" x2="1352" y2="54" stroke="#1A2830" stroke-width="1"/>

    <!-- ============= PRIMARY TYPOGRAPHY (stable, never animated) ============= -->
    <g font-family="'Helvetica Neue',Arial,sans-serif">
      <text x="50" y="200" font-size="104" font-weight="800" fill="#F9FBFB" letter-spacing="-2">BINARY</text>
      <text x="50" y="296" font-size="104" font-weight="800" fill="#F9FBFB" letter-spacing="-2">LOOPS</text>

      <g font-size="54" font-weight="700" letter-spacing="-0.5">
        <text x="52" y="368" fill="#C4D0D5">BUILDING</text>
        <text x="52" y="422" fill="#C4D0D5">SYSTEMS</text>
        <text x="52" y="476" fill="#3DE4F5">THAT THINK.</text>
      </g>

      <text x="52" y="522" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" fill="#C4D0D5" letter-spacing="1.5">SOFTWARE &#183; AI &#183; FULL-STACK &#183; SYSTEMS</text>

      <g transform="translate(52,556)">
        <circle cx="5" cy="-5" r="5" fill="#22D3EE">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="0" font-family="'SFMono-Regular',Consolas,monospace" font-size="16" font-weight="700" fill="#5DD9E9" letter-spacing="1.5">SYSTEM ONLINE</text>
      </g>
    </g>

    <!-- ============= THE BINARYLOOPS ENGINE (purely decorative motion) ============= -->
    <g class="orbit-decor" transform="translate(1030,320)">
      <circle r="230" fill="url(#coreGlow)"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="48s" repeatCount="indefinite"/>
        <ellipse rx="230" ry="90" fill="none" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1" transform="rotate(-18)"/>
        <circle cx="225" cy="0" r="3.4" fill="#5DD9E9" transform="rotate(-18)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <ellipse rx="170" ry="170" fill="none" stroke="#2E4550" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="1 7"/>
        <circle cx="0" cy="-170" r="2.6" fill="#8FA0A7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="36s" repeatCount="indefinite"/>
        <ellipse rx="120" ry="260" fill="none" stroke="#22D3EE" stroke-opacity="0.16" stroke-width="1" transform="rotate(32)"/>
        <circle cx="0" cy="255" r="2.4" fill="#22D3EE" transform="rotate(32)"/>
      </g>
      <circle r="272" fill="none" stroke="#152229" stroke-width="1"/>
      <g opacity="0.5">
        <line x1="-272" y1="0" x2="272" y2="0" stroke="url(#fade)" stroke-width="1.4">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
      </g>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="3.6s" repeatCount="indefinite" additive="sum"/>
        <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#0B1319" stroke="#22D3EE" stroke-width="1.4" filter="url(#blur1)" opacity="0.9"/>
        <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#5DD9E9" stroke-width="1"/>
        <circle r="4.5" fill="#EAFBFF"/>
      </g>
      <g class="telemetry" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#4C5D66" letter-spacing="1">
        <text x="-262" y="-248">N.24.07</text>
        <text x="196" y="256">SYNC&#183;0K</text>
        <text x="-256" y="270">LOOP.ACTIVE</text>
        <text x="150" y="-244">CORE&#183;STABLE</text>
      </g>
    </g>

    <line x1="48" y1="572" x2="1352" y2="572" stroke="#1A2830" stroke-width="1" class="frame-meta"/>
    <g class="frame-meta" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#7C8B92" letter-spacing="1.5">
      <text x="48" y="596">SIGNAL &#8594; COMPUTE &#8594; LOOP &#8594; OUTPUT</text>
      <text x="1352" y="596" text-anchor="end">CHENNAI, IN</text>
    </g>
  </g>
</svg>
