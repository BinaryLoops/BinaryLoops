<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="14" fill="#0B1117" stroke="#232F36"/>

  <text x="30" y="34" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#5A6C74" letter-spacing="1.5">04 / COMPUTATIONAL ACTIVITY</text>
  <line x1="30" y1="48" x2="1170" y2="48" stroke="#1E2A31"/>

  <!-- abstract oscilloscope-style pulse line, purely decorative, no fabricated data -->
  <polyline points="30,100 130,100 160,60 190,120 220,100 340,100 370,70 400,110 430,100 560,100 590,50 620,130 650,100 800,100 830,65 860,115 890,100 1000,100 1030,72 1060,108 1090,100 1170,100"
            fill="none" stroke="url(#pulseFade)" stroke-width="1.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3.4s" repeatCount="indefinite"/>
  </polyline>

  <g fill="#22D3EE">
    <circle cx="160" cy="60" r="2.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="50" r="2.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="65" r="2.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="72" r="2.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="30" y="128" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#7C8B92" letter-spacing="0.5">LIVE CONTRIBUTION DATA IS ON GITHUB &#8212; NOT REPRODUCED HERE.</text>
</svg>
