<svg width="100%" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <style>
      @media (max-width: 500px) {
        .note { display: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="150" rx="14" fill="#0B1117" stroke="#232F36"/>

  <text x="30" y="36" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" fill="#D7E2E6" letter-spacing="1">04 / COMPUTATIONAL ACTIVITY</text>
  <line x1="30" y1="50" x2="1170" y2="50" stroke="#1E2A31"/>

  <polyline points="30,100 130,100 160,60 190,120 220,100 340,100 370,70 400,110 430,100 560,100 590,50 620,130 650,100 800,100 830,65 860,115 890,100 1000,100 1030,72 1060,108 1090,100 1170,100"
            fill="none" stroke="url(#pulseFade)" stroke-width="1.8"/>

  <g fill="#22D3EE">
    <circle cx="160" cy="60" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="50" r="2.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="65" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="72" r="2.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text class="note" x="30" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#A7B4BA" letter-spacing="0.5">LIVE CONTRIBUTION DATA LIVES ON GITHUB &#8212; NOT REPRODUCED HERE.</text>
</svg>
