<svg width="100%" viewBox="0 0 1300 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ruglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeglowU" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeglowS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B7480" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B7480" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ugrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182229" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1300" height="580" rx="14" fill="#070B0F"/>
  <rect width="1300" height="580" rx="14" fill="url(#ugrid)"/>

  <text x="30" y="40" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" fill="#D7E2E6" letter-spacing="1">03 / REPOSITORY UNIVERSE</text>
  <text x="1270" y="40" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" font-weight="700" fill="#5DD9E9" letter-spacing="1">09 PUBLIC REPOSITORIES</text>
  <line x1="30" y1="54" x2="1270" y2="54" stroke="#1A2830"/>

  <!-- connections -->
  <g stroke="#233138" stroke-width="1" fill="none">
    <path d="M650,320 L650,120"/>
    <path d="M650,320 L750,201"/>
    <path d="M650,320 L847,285"/>
    <path d="M650,320 L784,398"/>
    <path d="M650,320 L718,508"/>
    <path d="M650,320 L597,466"/>
    <path d="M650,320 L477,420"/>
    <path d="M650,320 L497,293"/>
    <path d="M650,320 L550,201"/>
  </g>
  <g stroke="url(#nodeglowU)" stroke-width="1.5" fill="none" opacity="0.6">
