    <g transform="translate(497,293)">
      <circle r="13" fill="url(#nodeglowS)"/><circle r="4.5" fill="#8FA0A7"/>
      <text x="-14" y="-8" text-anchor="end" font-size="15" font-weight="700" fill="#C4D0D5">network-monitoring-dashboard</text>
      <text x="-14" y="10" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#7C8B92">TypeScript</text>
