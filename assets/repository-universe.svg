  <text x="30" y="558" font-family="'SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#7C8B92" letter-spacing="0.5">FULL INDEX AND LINKS BELOW &#8212; PRIVATE REPOSITORIES ARE NOT SHOWN.</text>
