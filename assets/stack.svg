<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="230" rx="14" fill="#0B1117" stroke="#232F36"/>

  <text x="30" y="34" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#5A6C74" letter-spacing="1.5">03 / TECHNOLOGY MATRIX</text>
  <line x1="30" y1="48" x2="1170" y2="48" stroke="#1E2A31"/>

  <!-- connecting line + node markers along the header, the loop motif restated as a straight signal line -->
  <g>
    <line x1="30" y1="48" x2="1170" y2="48" stroke="url(#tflow)" stroke-width="1.4">
      <animate attributeName="x1" values="30;1170;30" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="230;1370;230" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- six columns -->
  <g font-family="Helvetica,Arial,sans-serif">
    <!-- vertical separators -->
    <g stroke="#1B262D">
      <line x1="220" y1="64" x2="220" y2="200"/>
      <line x1="420" y1="64" x2="420" y2="200"/>
      <line x1="600" y1="64" x2="600" y2="200"/>
      <line x1="800" y1="64" x2="800" y2="200"/>
      <line x1="1000" y1="64" x2="1000" y2="200"/>
    </g>

    <g>
      <circle cx="34" cy="76" r="3" fill="#22D3EE"/>
      <text x="46" y="80" font-size="13" font-weight="700" fill="#F2F6F7" letter-spacing="0.5">LANGUAGES</text>
      <text x="34" y="108" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Python</text>
      <text x="34" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">C &#183; C++</text>
      <text x="34" y="152" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">TypeScript</text>
      <text x="34" y="174" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">JavaScript &#183; SQL</text>
    </g>

    <g transform="translate(234,0)">
      <circle cx="0" cy="76" r="3" fill="#22D3EE"/>
      <text x="12" y="80" font-size="13" font-weight="700" fill="#F2F6F7" letter-spacing="0.5">WEB</text>
      <text x="0" y="108" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">React</text>
      <text x="0" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Next.js</text>
      <text x="0" y="152" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Node.js</text>
      <text x="0" y="174" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Tailwind</text>
    </g>

    <g transform="translate(434,0)">
      <circle cx="0" cy="76" r="3" fill="#22D3EE"/>
      <text x="12" y="80" font-size="13" font-weight="700" fill="#F2F6F7" letter-spacing="0.5">APP</text>
      <text x="0" y="108" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Flutter</text>
      <text x="0" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Dart</text>
    </g>

    <g transform="translate(614,0)">
      <circle cx="0" cy="76" r="3" fill="#22D3EE"/>
      <text x="12" y="80" font-size="13" font-weight="700" fill="#F2F6F7" letter-spacing="0.5">DATA</text>
      <text x="0" y="108" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">PostgreSQL</text>
      <text x="0" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">MySQL</text>
      <text x="0" y="152" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Prisma</text>
      <text x="0" y="174" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Redis</text>
    </g>

    <g transform="translate(814,0)">
      <circle cx="0" cy="76" r="3" fill="#22D3EE"/>
      <text x="12" y="80" font-size="13" font-weight="700" fill="#F2F6F7" letter-spacing="0.5">SYSTEMS</text>
      <text x="0" y="108" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Socket.IO</text>
      <text x="0" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">BullMQ</text>
      <text x="0" y="152" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Mapbox</text>
      <text x="0" y="174" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Git</text>
    </g>

    <g transform="translate(1014,0)">
      <circle cx="0" cy="76" r="3" fill="#22D3EE"/>
      <text x="12" y="80" font-size="13" font-weight="700" fill="#F2F6F7" letter-spacing="0.5">CLOUD</text>
      <text x="0" y="108" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">AWS</text>
      <text x="0" y="130" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#A7B4BA">Docker</text>
    </g>
  </g>
</svg>
